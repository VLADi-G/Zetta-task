# Application Name
spring.application.name=message-processor

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:message-processor-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

# Database Configuration
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:messagedb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Application Configuration
app.kafka.input-topic=${INPUT_TOPIC:input-messages}
app.kafka.output-topic=${OUTPUT_TOPIC:output-messages}
app.kafka.consumer-group=${KAFKA_CONSUMER_GROUP:message-processor-group}

# Rules Configuration
app.rules.condition-file=${CONDITION_RULES_FILE:classpath:condition-rules.json}
app.rules.transformation-file=${TRANSFORMATION_RULES_FILE:classpath:transformation-rules.json}

# Logging Configuration
logging.level.com.zetta.task=DEBUG
logging.level.org.springframework.kafka=INFO
logging.level.org.hibernate=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
