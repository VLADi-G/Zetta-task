spring:
  application:
    name: message-processor
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:message-processor-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  
  # Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:messagedb}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  h2:
    console:
      enabled: true
      path: /h2-console

# Application Configuration
app:
  kafka:
    input-topic: ${INPUT_TOPIC:input-messages}
    output-topic: ${OUTPUT_TOPIC:output-messages}
    consumer-group: ${KAFKA_CONSUMER_GROUP:message-processor-group}
  
  rules:
    condition-file: ${CONDITION_RULES_FILE:classpath:condition-rules.json}
    transformation-file: ${TRANSFORMATION_RULES_FILE:classpath:transformation-rules.json}

# Logging Configuration
logging:
  level:
    com.zetta.task: DEBUG
    org.springframework.kafka: INFO
    org.hibernate: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
